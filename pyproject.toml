[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Voice-driven orchestrator that delegates tasks to Claude and Codex worker agents"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hasan" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.0"]
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "pynput>=1.7",
    "onnxruntime>=1.18",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
